<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频转录测试</title>
</head>
<body>
    <h1>音频转录测试</h1>

    <form id="uploadForm">
        <div>
            <label for="audioFile">选择音频文件:</label>
            <input type="file" id="audioFile" name="file" accept="audio/wav,audio/webm" required>
            <small>支持格式 WebM</small>
        </div>

        <div style="margin-top: 20px;">
            <button type="submit">上传并转录</button>
        </div>
    </form>

    <div id="result" style="margin-top: 20px;"></div>

    <script>
        let audioUrl = null;

        document.getElementById('uploadForm').onsubmit = async function(e) {
            e.preventDefault();

            const formData = new FormData();
            const fileInput = document.getElementById('audioFile');
            const resultDiv = document.getElementById('result');

            if (!fileInput.files[0]) {
                alert('请选择音频文件');
                return;
            }
            const file = fileInput.files[0];
            formData.append('file', file);

            resultDiv.innerHTML = '<p>正在处理...</p>';

            if (audioUrl) { URL.revokeObjectURL(audioUrl); }
            audioUrl = URL.createObjectURL(file);

            try {
                const response = await fetch('https://tymh.whhealth.org.cn/GWY/znldxtyy/transcribe?apiKey=sk-7f3a9b2c1e5d8f4a6b0c9e2d1a5f8b3c', {
                    method: 'POST',
                    body: formData
                });

                // const response = await fetch('http://localhost:27000/transcribe?apiKey=sk-7f3a9b2c1e5d8f4a6b0c9e2d1a5f8b3c', {
                //     method: 'POST',
                //     body: formData
                // });

                const data = await response.json();

                // 显示结果
                let resultHtml = '<h3>转录结果:</h3>';
                resultHtml += '<p><strong>状态码:</strong> ' + data.code + '</p>';
                resultHtml += '<p><strong>消息:</strong> ' + (data.info || '') + '</p>';
                resultHtml += '<p><strong>转录文本:</strong></p>';
                resultHtml += '<div style="background: #f5f5f5; padding: 10px; margin: 10px 0;">' +
                             (data.data || '无文本内容') + '</div>';

                // 句子级时间区间（相对音频开始，毫秒）
                const sentences = data.sentences || [];
                if (sentences.length) {
                    resultHtml += '<h3>句子时间区间（相对音频开始）</h3>';
                    resultHtml += '<audio id="player" controls src="' + audioUrl +
                                  '" style="width: 100%; margin-bottom: 10px;"></audio>';
                    resultHtml += '<table border="1" cellpadding="6" cellspacing="0" ' +
                                  'style="border-collapse: collapse; width: 100%;">';
                    resultHtml += '<tr style="background: #fafafa;">' +
                                  '<th>#</th><th>start_ms</th><th>end_ms</th><th>句子</th><th>试听</th></tr>';
                    sentences.forEach(function (s, i) {
                        resultHtml += '<tr><td>' + (i + 1) + '</td><td>' + s.start_ms + '</td><td>' +
                                      s.end_ms + '</td><td>' + s.text + '</td>' +
                                      '<td><button type="button" class="playBtn" data-start="' + s.start_ms +
                                      '" data-end="' + s.end_ms + '">播放本句</button></td></tr>';
                    });
                    resultHtml += '</table>';
                } else {
                    resultHtml += '<p style="color: #888;">未返回句子时间区间（sentences 为空）</p>';
                }

                resultDiv.innerHTML = resultHtml;

                // 点「播放本句」即从该句起止时间播放
                const player = document.getElementById('player');
                resultDiv.querySelectorAll('.playBtn').forEach(function(btn) {
                    btn.onclick = function() {
                        if (!player) { return; }
                        const start = Number(btn.dataset.start) / 1000;
                        const end = Number(btn.dataset.end) / 1000;
                        player.currentTime = start;
                        player.play();
                        const stopAt = function() {
                            if (player.currentTime >= end) {
                                player.pause();
                                player.removeEventListener('timeupdate', stopAt);
                            }
                        };
                        player.addEventListener('timeupdate', stopAt);
                    };
                });

            } catch (error) {
                resultDiv.innerHTML = '<p style="color: red;">错误: ' + error.message + '</p>';
            }
        };
    </script>
</body>
</html>
