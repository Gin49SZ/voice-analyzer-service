<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频转录测试</title>
</head>
<body>
    <h1>音频转录测试</h1>

    <form id="uploadForm">
        <div>
            <label for="audioFile">选择音频文件:</label>
            <input type="file" id="audioFile" name="file" accept="audio/wav,audio/webm" required>
            <small>支持格式 WebM</small>
        </div>

        <div style="margin-top: 20px;">
            <button type="submit">上传并转录</button>
        </div>
    </form>

    <div id="result" style="margin-top: 20px;"></div>

    <script>
        document.getElementById('uploadForm').onsubmit = async function(e) {
            e.preventDefault();

            const formData = new FormData();
            const fileInput = document.getElementById('audioFile');
            const resultDiv = document.getElementById('result');

            if (!fileInput.files[0]) {
                alert('请选择音频文件');
                return;
            }

            formData.append('file', fileInput.files[0]);

            resultDiv.innerHTML = '<p>正在处理...</p>';

            try {
                const response = await fetch('https://tymh.whhealth.org.cn/GWY/znldxtyy/transcribe?apiKey=sk-7f3a9b2c1e5d8f4a6b0c9e2d1a5f8b3c', {
                    method: 'POST',
                    body: formData
                });

                // const response = await fetch('http://localhost:8089/transcribe?apiKey=sk-7f3a9b2c1e5d8f4a6b0c9e2d1a5f8b3c', {
                //     method: 'POST',
                //     body: formData
                // });

                const data = await response.json();

                // 显示结果
                let resultHtml = '<h3>转录结果:</h3>';
                resultHtml += '<p><strong>状态码:</strong> ' + data.code + '</p>';
                resultHtml += '<p><strong>消息:</strong> ' + data.msg + '</p>';
                resultHtml += '<p><strong>转录文本:</strong></p>';
                resultHtml += '<div style="background: #f5f5f5; padding: 10px; margin: 10px 0;">' +
                             (data.data || '无文本内容') + '</div>';

                resultDiv.innerHTML = resultHtml;

            } catch (error) {
                resultDiv.innerHTML = '<p style="color: red;">错误: ' + error.message + '</p>';
            }
        };
    </script>
</body>
</html>
